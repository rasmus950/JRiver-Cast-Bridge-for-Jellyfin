[workspace]
# JRiver Cast Bridge for Jellyfin: the bridge, its MCWS client and build tasks.
members = [
  "crates/jriver-mcws",
  "crates/jriver-cast-bridge",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/rasmus950/JRiver-Cast-Bridge-for-Jellyfin"
rust-version = "1.100"
# The project version: the installer and the About window show it.
version = "0.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_methods = "warn"
disallowed_types = "warn"
