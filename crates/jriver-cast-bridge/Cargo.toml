[package]
name = "jriver-cast-bridge"
description = "JRiver Cast Bridge for Jellyfin: makes JRiver Media Center a Jellyfin cast target"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "bridge-cli"
path = "src/bin/bridge_cli.rs"

[[bin]]
name = "jriver-cast-bridge"
path = "src/bin/jriver_cast_bridge/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
# The settings, login and About windows, software-rendered: no GPU needed.
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "fira-sans", "crisp"] }
jriver-mcws = { path = "../jriver-mcws" }
futures-util = "0.3.32"
keyring = "4.1.2"
log = "0.4"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
rpassword = "7.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "0.9"
# The settings window edits config.toml in place, keeping its comments.
toml_edit = "0.25.11"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log", "ansi", "chrono"] }
tray-icon = { version = "0.23.1", default-features = false }
uuid = { version = "1.23.1", features = ["v4"] }
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }

[lints]
workspace = true
